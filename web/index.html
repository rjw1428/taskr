<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A cross-platform to-do app">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="taskr">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico"/>

  <title>taskr</title>
  <link rel="manifest" href="manifest.json">

  <style>
    .firebase-emulator-warning {
      display: none;
    }
  </style>
</head>
<body>
  <!--
    The app is built with --pwa-strategy=none (see deploy-web.sh), so nothing
    registers a service worker any more. Browsers that visited an older build
    still have one, and it keeps serving that build's cached assets - including
    a stale, icon-tree-shaken font that is missing glyphs added since. Tear any
    survivor down and reload once so the page comes back from the network.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        var done = regs.map(function (r) { return r.unregister(); });
        if (window.caches) {
          done.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(done).then(function () {
          if (sessionStorage.getItem('sw-purged')) return;
          sessionStorage.setItem('sw-purged', '1');
          location.reload();
        });
      }).catch(function () {});
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
